  <title>Xiang Li | Mathematics at UCLA</title>
  <style>
    @font-face {
      font-family: "CMU Serif";
      src: url("./fonts/cmu-serif-regular.woff2") format("woff2");
      font-style: normal;
      font-weight: 400;
      font-display: swap;
    }
    @font-face {
      font-family: "CMU Serif";
      src: url("./fonts/cmu-serif-bold.woff2") format("woff2");
      font-style: normal;
      font-weight: 700;
      font-display: swap;
    }
    :root {
      color-scheme: dark;
      --paper: #1535ed;
      --ink: #ffffff;
      --link: #fff000;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: "CMU Serif", "Times New Roman", Times, serif;
      font-size: 1rem;
      line-height: 1.65;
    }
    ::selection { background: var(--ink); color: var(--paper); }
    main {
      width: min(38rem, calc(100% - 3rem));
      margin: 5rem auto;
    }
    h1 {
      margin: 0 0 1.8rem;
      padding: 0 0 0.8rem;
      border-bottom: 4px double var(--ink);
      font-size: 1.9rem;
      line-height: 1.25;
      font-weight: 700;
    }
    p { margin: 0 0 1.7rem; }
    h2 {
      margin: 0 0 0.35rem;
      font-size: 1rem;
      line-height: 1.65;
    }
    ul {
      margin: 0;
      padding-left: 1.25rem;
      list-style-type: square;
    }
    li { padding-left: 0.2rem; }
    a {
      color: var(--link);
      text-decoration: underline;
      text-decoration-thickness: 1px;
      text-underline-offset: 0.15em;
    }
    a:hover {
      background: var(--link);
      color: var(--paper);
      text-decoration: none;
    }
    a:focus-visible {
      outline: 2px solid var(--link);
      outline-offset: 4px;
    }
    @media (max-width: 600px) {
      main { margin-top: 2.5rem; margin-bottom: 2.5rem; }
    }
    @media print {
      :root { color-scheme: light; --paper: #fff; --ink: #000; --link: #000; }
      main { width: 100%; margin: 0; }
    }
  </style>
</head>
<body>
  <main id="about">
    <h1>Xiang Li</h1>
    <!-- Update the year of study here as needed. -->
    <p>I am a fourth-year PhD student in mathematics at
      <a href="https://ww3.math.ucla.edu/">UCLA</a>, supervised by
      <a href="https://www.math.ucla.edu/~ineeman/">Itay Neeman</a>.</p>

    <section id="research" aria-labelledby="research-title">
      <h2 id="research-title">Research interests</h2>
      <ul>
        <li>Forcing</li>
        <li>Large cardinals</li>
        <li>Partition relations</li>
      </ul>
    </section>
  </main>
</body>
