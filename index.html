<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Xiang Li is a fourth-year PhD student in mathematics at UCLA, supervised by Itay Neeman. Research interests: forcing, large cardinals, and partition relations.">
  <meta name="theme-color" content="#1535ed">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Xiang Li | Mathematics at UCLA">

  <meta property="og:url" content="https://lix0120.github.io/">

  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%231535ed'/%3E%3Ctext x='32' y='44' fill='white' text-anchor='middle' font-family='Courier New,monospace' font-size='38'%3EXL%3C/text%3E%3C/svg%3E">
  <title>Xiang Li | Mathematics at UCLA</title>
  <style>
    :root {
      color-scheme: dark;
      --paper: #1535ed;
      --ink: #ffffff;
      --link: #fff000;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: "Courier New", Courier, monospace;
      font-size: 1rem;
      font-weight: 400;
      line-height: 1.65;
    }
    ::selection { background: var(--ink); color: var(--paper); }
    main {
      margin: 3rem 2rem;
    }
    .page-header {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      flex-wrap: wrap;
      gap: 1rem 4rem;
      margin-bottom: 1.8rem;
      padding-bottom: 0.8rem;
      border-bottom: 1px solid var(--ink);
    }
    h1 {
      margin: 0;
      font-size: 1.5rem;
      line-height: 1.25;
      font-weight: 400;
    }
    .contact {
      display: grid;
      grid-template-columns: max-content minmax(0, 1fr);
      max-width: 100%;
      gap: 0.15rem 0.5rem;
      margin: 0;
      font-size: 0.875rem;
      font-style: normal;
      line-height: 1.5;
    }
    .email-image {
      display: block;
      width: 12.785714em;
      max-width: 100%;
      height: auto;
    }
    p { margin: 0 0 1.7rem; }
    h2 {
      margin: 0 0 0.35rem;
      font-size: 1rem;
      font-weight: 400;
      line-height: 1.65;
    }
    ul {
      margin: 0;
      padding-left: 1.25rem;
      list-style-type: square;
    }
    li { padding-left: 0.2rem; }
    a {
      color: var(--link);
      text-decoration: underline;
      text-decoration-thickness: 1px;
      text-underline-offset: 0.15em;
    }
    a:hover {
      background: var(--link);
      color: var(--paper);
      text-decoration: none;
    }
    a:focus-visible {
      outline: 2px solid var(--link);
      outline-offset: 4px;
    }
    @media (max-width: 600px) {
      main { margin: 2rem 1.5rem; }
    }
    @media print {
      :root { color-scheme: light; --paper: #fff; --ink: #000; --link: #000; }
      main { width: 100%; margin: 0; }
      .email-image { filter: invert(1); }
    }
  </style>
</head>
<body>
  <main id="about">
    <header class="page-header">
      <h1>Xiang Li</h1>
      <address class="contact">
        <span>Email:</span>
        <img class="email-image" src="./assets/contact.png" width="179" height="21"
          alt="xiangli at math dot ucla dot edu">
        <span>Office:</span>
        <span>MS 3969</span>
      </address>
    </header>
    <!-- Update the year of study here as needed. -->
    <p>I am a fourth-year PhD student in mathematics at
      <a href="https://ww3.math.ucla.edu/">UCLA</a>, supervised by
      <a href="https://www.math.ucla.edu/~ineeman/">Itay Neeman</a>.</p>

    <p>Before joining UCLA, I earned a MASt in Pure Mathematics from the
      University of Cambridge.</p>

    <section id="research" aria-labelledby="research-title">
      <h2 id="research-title">Research interests</h2>
      <ul>
        <li>Forcing</li>
        <li>Large cardinals</li>
        <li>Partition relations</li>
      </ul>
    </section>
  </main>
</body>
</html>
